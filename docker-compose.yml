services:
  #banco
  postgres:
    image: postgres:15-alpine
    container_name: taskou-postgres
    restart: always
    environment:
      POSTGRES_USER: taskou_user
      POSTGRES_PASSWORD: taskou_password
      POSTGRES_DB: taskou_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskou_user -d taskou_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend-api:
    build: ./backend-api
    container_name: taskou-backend
    restart: always
    environment:
      DATABASE_URL: "postgresql://taskou_user:taskou_password@postgres:5432/taskou_db?schema=public"
      JWT_SECRET: "tometometometome"
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: taskou-frontend
    restart: always

  nginx:
    image: nginx:alpine
    container_name: taskou-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend-api
      - frontend
      

volumes:
  postgres_data:
