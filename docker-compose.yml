services:
  postgres:
    image: postgres:15-alpine
    container_name: taskou-postgres
    restart: always
    environment:
      POSTGRES_USER: taskou_user
      POSTGRES_PASSWORD: taskou_password
      POSTGRES_DB: taskou_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
